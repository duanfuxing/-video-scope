[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "video-scope"
version = "0.1.0"
description = "Independent local video evidence preparation for VideoScope"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai>=2.34,<3",
    "httpx[socks]>=0.28,<1",
    "numpy>=2,<3",
    "opencv-python-headless>=4.11,<5",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.1,<2",
    "typer>=0.20,<1",
]

[project.scripts]
video-scope = "video_scope.cli:app"

[dependency-groups]
dev = ["mypy>=1.18,<2", "pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/video_scope"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
